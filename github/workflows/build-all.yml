name: Build all

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "آدرس سرور، مثال http://185.1.2.3"
        required: true
        default: "http://1.1.1.1"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip projects
        run: |
          mkdir server android
          unzip -q BuildingManager.zip -d server
          unzip -q BuildingManagerApp-Android.zip -d android

      - name: Download web libraries
        run: |
          cd server/BuildingManager/wwwroot
          mkdir -p lib/bootstrap lib/jquery lib/fonts
          curl -fsSL https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css -o lib/bootstrap/bootstrap.rtl.min.css
          curl -fsSL https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js -o lib/bootstrap/bootstrap.bundle.min.js
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js -o lib/jquery/jquery.min.js
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/jquery-validate/1.19.5/jquery.validate.min.js -o lib/jquery/jquery.validate.min.js
          curl -fsSL https://cdnjs.cloudflare.com/ajax/libs/jquery-validation-unobtrusive/4.0.0/jquery.validate.unobtrusive.min.js -o lib/jquery/jquery.validate.unobtrusive.min.js
          curl -fsSL "https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.3/fonts/webfonts/Vazirmatn%5Bwght%5D.woff2" -o lib/fonts/Vazirmatn.woff2

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish server (linux-x64)
        run: |
          dotnet publish server/BuildingManager/BuildingManager.csproj -c Release -r linux-x64 --self-contained true -o out
          cd out && zip -qr ../server-linux.zip .

      - name: Set server URL in Android app
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          sed -i "s|http://YOUR-SERVER-ADDRESS|$APP_URL|" android/BuildingManagerApp/app/src/main/res/values/strings.xml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build APK
        working-directory: android/BuildingManagerApp
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: server-linux
          path: server-linux.zip

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/BuildingManagerApp/app/build/outputs/apk/debug/app-debug.apk
